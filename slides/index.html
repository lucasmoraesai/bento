.bs-mark{position:relative;width:104px;height:104px;border-radius:24px;background:#0a0a0a;box-shadow:0 0 56px rgba(0,229,255,.22),0 10px 34px rgba(0,0,0,.65);overflow:hidden;animation:bsIn .7s cubic-bezier(.22,1.4,.36,1) both,bsFloat 3.4s ease-in-out .9s infinite}
.bs-mark i{position:absolute;border-radius:9px;opacity:0;animation:bsTile .55s cubic-bezier(.25,1.5,.45,1) both}
.bs-b{left:12px;top:12px;width:24px;height:80px;background:#00e5ff;animation-delay:.18s}
.bs-a{right:12px;top:12px;width:50px;height:37px;background:#ff2ec4;animation-delay:.3s}
.bs-c{right:12px;bottom:12px;width:50px;height:37px;background:#a3ff12;animation-delay:.42s}
.bs-mark:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.28) 50%,transparent 62%);transform:translateX(-130%);animation:bsSheen 1s ease 1.05s both}
.bs-word{font:600 15px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#ededed;letter-spacing:.42em;text-transform:uppercase;text-indent:.42em;animation:bsUp .6s ease .55s both}
.bs-word b{color:#00e5ff;font-weight:800}
.bs-bar{width:124px;height:2px;border-radius:1px;background:rgba(255,255,255,.13);overflow:hidden;animation:bsUp .5s ease .85s both}
.bs-bar i{display:block;width:44%;height:100%;border-radius:1px;background:linear-gradient(90deg,#00e5ff,#ff2ec4);animation:bsScan 1.1s cubic-bezier(.45,0,.55,1) 1s infinite alternate}
@keyframes bsIn{from{transform:scale(.55) rotate(-8deg);opacity:0}}
@keyframes bsTile{from{transform:translateY(28px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes bsSheen{to{transform:translateX(130%)}}
@keyframes bsFloat{50%{transform:translateY(-5px)}}
@keyframes bsUp{from{opacity:0;transform:translateY(10px)}}
@keyframes bsScan{from{transform:translateX(-30%)}to{transform:translateX(210%)}}
@keyframes bsAuto{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#bento-splash,#bento-splash *,.bs-mark:after{animation-duration:.01ms;animation-delay:0ms;animation-iteration-count:1}}
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
